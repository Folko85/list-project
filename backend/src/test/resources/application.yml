server:
  port : 5000

security:
  jwt:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

spring:
  main:
    allow-bean-definition-overriding: true
    banner-mode: 'off'
  jmx.default-domain: test
  datasource:
    username: user
    password: password
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:mydb1
  liquibase:
    change-log: /db/changelog/changelog.yml
    enabled: false
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

jasypt:
  encryptor:
    bean: encryptorBean